<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Sleepy monitor logo for Instant Blank Screen">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be9fd"/>
      <stop offset="1" stop-color="#7c6cf0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2547"/>
      <stop offset="1" stop-color="#10182f"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5c2"/>
      <stop offset="1" stop-color="#ffcf7a"/>
    </linearGradient>
  </defs>

  <!-- sparkles -->
  <path d="M104 20l2.2 5.8L112 28l-5.8 2.2L104 36l-2.2-5.8L96 28l5.8-2.2Z" fill="#a5b4fc" opacity=".9"/>
  <path d="M23 44l1.5 4L28.5 49.5 24.5 51 23 55l-1.5-4L17.5 49.5 21.5 48Z" fill="#8be9fd" opacity=".75"/>

  <!-- monitor body -->
  <rect x="16" y="20" width="96" height="68" rx="12" fill="url(#screen)" stroke="url(#body)" stroke-width="4"/>
  <rect x="22" y="26" width="84" height="56" rx="8" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/>

  <!-- sleepy face -->
  <path d="M42 49q6 7 12 0" fill="none" stroke="#bde9ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M74 49q6 7 12 0" fill="none" stroke="#bde9ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 62q6 6 12 0" fill="none" stroke="#bde9ff" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="37" cy="59" rx="5" ry="3" fill="#ff8fb1" opacity=".55"/>
  <ellipse cx="91" cy="59" rx="5" ry="3" fill="#ff8fb1" opacity=".55"/>

  <!-- crescent moon -->
  <path d="M96 30a11 11 0 1 0 11 11 9 9 0 0 1-11-11Z" fill="url(#moon)"/>

  <!-- stand -->
  <rect x="57" y="88" width="14" height="12" rx="3" fill="url(#body)"/>
  <rect x="44" y="99" width="40" height="7" rx="3.5" fill="url(#body)"/>
  <ellipse cx="64" cy="110" rx="30" ry="4" fill="#7c6cf0" opacity=".18"/>
</svg>
